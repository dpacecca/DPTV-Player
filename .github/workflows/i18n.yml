name: i18n

# Lightweight, deliberately SEPARATE from android.yml (which the repo restricts to main / v* tags).
# Three jobs, all gating:
#   baseline  — the hardcoded-literal ratchet against the pull-request merge base (not HEAD^, which
#               is bypassable in a multi-commit PR).
#   validate  — locales.json schema + placeholder/plural parity + the Tier 1 100% coverage gate.
#   pseudo    — inspects the BUILT debug and release APKs and proves pseudolocales survived
#               localeFilters in debug and are absent in release. The flag being set is not proof.
#
# Why merge base and not HEAD^: a baseline can grow in commit 2 and stay untouched in the final
# commit, so the final commit's diff against its parent passes while the PR as a whole regressed.
# The required invariant is: PR-head baseline ⊆ pull-request merge-base baseline.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch base branch
        if: ${{ github.event_name == 'pull_request' }}
        run: git fetch --no-tags --depth=1 origin "${GITHUB_BASE_REF}"

      - name: Hardcoded-literal ratchet
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$(git merge-base HEAD "origin/${GITHUB_BASE_REF}")"
            git show "${BASE_SHA}:tools/i18n/hardcoded_baseline.txt" > /tmp/hardcoded_baseline.base.txt
            python3 tools/i18n/check_hardcoded_strings.py verify --base /tmp/hardcoded_baseline.base.txt
          else
            # Non-PR trigger (workflow_dispatch): compare against the current committed baseline only.
            cp tools/i18n/hardcoded_baseline.txt /tmp/hardcoded_baseline.base.txt
            python3 tools/i18n/check_hardcoded_strings.py verify --base /tmp/hardcoded_baseline.base.txt
          fi

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate strings and locales.json
        run: python3 tools/i18n/validate_strings.py

  pseudo:
    # Builds the debug + release standard APKs and inspects their resource tables. Heavier than the
    # other two jobs, so it is its own job rather than piggy-backed on android.yml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Assemble standard debug + release APKs
        run: ./gradlew :app:assembleStandardDebug :app:assembleStandardRelease --console=plain
      - name: Verify pseudolocale packaging
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          DBG=$(ls app/build/outputs/apk/standard/debug/*.apk | head -1)
          REL=$(ls app/build/outputs/apk/standard/release/*.apk | head -1)
          python3 tools/i18n/check_pseudo_locales.py --apk "$DBG" --mode debug
          python3 tools/i18n/check_pseudo_locales.py --apk "$REL" --mode release
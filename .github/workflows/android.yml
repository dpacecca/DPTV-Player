name: Android CI

# Two jobs:
#   check      — unit tests + lint (app and core-lib). Gates the build.
#   build      — assembles the APK, and publishes a GitHub Release on v* tags or when started with
#                a release type from the Actions tab. Never runs for a PR, so PR branches only get
#                the test/lint verdict.
#
# Release button: Actions → Android CI → Run workflow → release = patch / minor / major. The next
# version is the newest v* tag bumped accordingly (v1.0.0 → v1.0.1 / v1.1.0 / v2.0.0); the release
# step creates that tag itself, so no one has to push a tag.
on:
  push:
    branches: [ master ]
    tags: [ "v*" ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release? Pick the version bump (none = just build the APK)"
        type: choice
        options: [ none, patch, minor, major ]
        default: none

permissions:
  contents: write   # required so tag builds can create a Release

# Core (tv.own.owntv:core, :player-core) is built from core-lib/ in this repository (composite
# build), and the mpv engine (tv.own.owntv:libmpv) resolves from upstream OwnTV's public Maven
# repository (https://ahxn00.github.io/OwnTV_Core/maven) — no token needed.

concurrency:
  # A release run gets its own group, so a later push to master cannot cancel it.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.release || 'build' }}
  cancel-in-progress: true

jobs:
  # Nothing was checking the unit tests or lint before, so both could rot silently while the APK
  # kept building. This job is the gate: if it is red, no APK is produced and no release is cut.
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # 'tools' is obsolete and Google removed it from the SDK repository; the
          # action still asks for it by default, which fails the whole setup step.
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Private-repo runners have 7 GB of RAM; gradle.properties asks for a 4 GB Gradle heap plus an
      # 8 GB Kotlin daemon, and R8 on a release build then gets the runner killed. Properties in the
      # Gradle user home override the project's, so this only changes CI: Kotlin compiles inside the
      # Gradle JVM, two workers, plus swap as headroom. Local builds keep gradle.properties.
      - name: Fit Gradle to the runner's memory
        run: |
          mkdir -p "${GRADLE_USER_HOME:-$HOME/.gradle}"
          cat >> "${GRADLE_USER_HOME:-$HOME/.gradle}/gradle.properties" <<'PROPS'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          kotlin.compiler.execution.strategy=in-process
          org.gradle.workers.max=2
          PROPS
          sudo fallocate -l 4G /mnt/ci-swapfile && sudo chmod 600 /mnt/ci-swapfile \
            && sudo mkswap /mnt/ci-swapfile && sudo swapon /mnt/ci-swapfile \
            || echo "::warning::Could not add swap; continuing without it."
          free -h

      # One variant, not `test`/`lint` across every flavor: standard+debug is the variant the JVM
      # tests are written against, and the ABI flavors differ only in the packaged native libs.
      - name: Unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew testStandardDebugUnitTest --stacktrace

      - name: Core library unit tests
        if: always()
        working-directory: core-lib
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest --stacktrace

      # abortOnError = true in app/build.gradle.kts, so this fails the job on a lint error.
      - name: Lint
        if: always()   # report both verdicts in one run instead of one failure at a time
        run: ./gradlew lintStandardDebug --stacktrace

      - name: Upload test and lint reports
        if: always()   # the reports matter most when the step above failed
        uses: actions/upload-artifact@v7
        with:
          name: check-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.txt
          if-no-files-found: warn

  build:
    needs: check
    # PRs get the check job only — no APK, no release. Unchanged from ac33c65.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      # True for a v* tag push; the "Release version" step also sets it for the release button.
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
      # The release's tag (v1.2.3). Set by the "Release version" step.
      RELEASE_TAG: ""
      # Set at runtime via $GITHUB_ENV in the "Name the APK" step. Declared here (empty) so static
      # linters don't flag the later ${{ env.APK_OUT }} references as "context access might be invalid".
      APK_OUT: ""
      # Set by the "Check the releases-repository token" step when RELEASES_REPO_TOKEN exists.
      HAS_RELEASES_TOKEN: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # tags + history: the release button bumps the newest tag, notes list commits

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'   # matches gradle/gradle-daemon-jvm.properties (toolchainVersion=21)

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # 'tools' is obsolete and Google removed it from the SDK repository; the
          # action still asks for it by default, which fails the whole setup step.
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Private-repo runners have 7 GB of RAM; gradle.properties asks for a 4 GB Gradle heap plus an
      # 8 GB Kotlin daemon, and R8 on a release build then gets the runner killed. Properties in the
      # Gradle user home override the project's, so this only changes CI: Kotlin compiles inside the
      # Gradle JVM, two workers, plus swap as headroom. Local builds keep gradle.properties.
      - name: Fit Gradle to the runner's memory
        run: |
          mkdir -p "${GRADLE_USER_HOME:-$HOME/.gradle}"
          cat >> "${GRADLE_USER_HOME:-$HOME/.gradle}/gradle.properties" <<'PROPS'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          kotlin.compiler.execution.strategy=in-process
          org.gradle.workers.max=2
          PROPS
          sudo fallocate -l 4G /mnt/ci-swapfile && sudo chmod 600 /mnt/ci-swapfile \
            && sudo mkswap /mnt/ci-swapfile && sudo swapon /mnt/ci-swapfile \
            || echo "::warning::Could not add swap; continuing without it."
          free -h

      - name: Release version
        env:
          BUMP: ${{ inputs.release || 'none' }}
        run: |
          if [ "$IS_TAG" = "true" ]; then
            # A pushed v* tag: release exactly that.
            echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] || [ "$BUMP" = "none" ]; then
            exit 0   # plain build
          fi
          # Release button: newest vX.Y.Z tag, bumped. No tag yet starts from v0.0.0.
          LAST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          IFS='.' read -r MA MI PA <<< "${LAST:-v0.0.0}"
          MA=${MA#v}
          case "$BUMP" in
            major) MA=$((MA + 1)); MI=0; PA=0 ;;
            minor) MI=$((MI + 1)); PA=0 ;;
            patch) PA=$((PA + 1)) ;;
            *) echo "::error::Unknown release type '$BUMP'."; exit 1 ;;
          esac
          if [ "$MI" -gt 99 ] || [ "$PA" -gt 99 ]; then
            # versionCode is major*10000 + minor*100 + patch, so minor/patch must stay below 100.
            echo "::error::v$MA.$MI.$PA does not fit the version code; bump minor or major instead."
            exit 1
          fi
          NEXT="v$MA.$MI.$PA"
          if git rev-parse -q --verify "refs/tags/$NEXT" >/dev/null; then
            echo "::error::Tag $NEXT already exists."; exit 1
          fi
          echo "Releasing $NEXT (previous: ${LAST:-none})"
          echo "IS_TAG=true" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$NEXT" >> "$GITHUB_ENV"

      - name: Compute version (from the git tag on releases)
        id: ver
        run: |
          if [ "$IS_TAG" = "true" ]; then
            NAME="${RELEASE_TAG#v}"                     # tag v1.2.0 -> 1.2.0
            IFS='.' read -r MA MI PA <<< "$NAME"
            CODE=$(( ${MA:-0} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))   # 1.2.0 -> 10200
            [ "$CODE" -gt 0 ] || CODE=1
          else
            # Dev (non-tag) builds mirror the local-build fallback in app/build.gradle.kts:
            # pinned HIGH so a dev APK always installs over any published release
            # (no INSTALL_FAILED_VERSION_DOWNGRADE) and the in-app updater stays quiet.
            NAME="99.99.99"
            CODE=99999
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Version: $NAME (code $CODE)"

      - name: Decode signing keystore (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # Runs on every push (not just tags) so dev builds are also signed RELEASE builds —
          # required since R8 was enabled: only assembleRelease exercises shrinking/keep rules,
          # and a release-signed dev APK installs straight over a published release for testing.
          # Fork PRs have no secrets, so they fall back to a debug build below.
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Release signing configured."
          else
            echo "No KEYSTORE_BASE64 secret set — building a debug-signed APK."
          fi

      # Derives this release's edge key for the default metadata/subtitle service. Falls back to the
      # static OWNTV_EDGE_KEY, then to "" — a fork has neither secret and the app uses its open base
      # URL, exactly as before.
      - name: Derive the release edge key
        env:
          OWNTV_EDGE_MASTER: ${{ secrets.OWNTV_EDGE_MASTER }}
          OWNTV_EDGE_KEY: ${{ secrets.OWNTV_EDGE_KEY }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: |
          if [ -n "$OWNTV_EDGE_MASTER" ]; then
            # No trailing newline in the input; the server derives it the same way.
            KEY=$(printf '%s' "$VERSION_NAME" \
              | openssl dgst -sha256 -hmac "$OWNTV_EDGE_MASTER" -hex \
              | awk '{print $NF}')
            echo "::add-mask::$KEY"
            echo "OWNTV_EDGE_KEY=$KEY" >> "$GITHUB_ENV"
            echo "Derived the edge key for $VERSION_NAME."
          elif [ -n "$OWNTV_EDGE_KEY" ]; then
            echo "::add-mask::$OWNTV_EDGE_KEY"
            echo "OWNTV_EDGE_KEY=$OWNTV_EDGE_KEY" >> "$GITHUB_ENV"
            echo "No OWNTV_EDGE_MASTER — using the static edge key."
          else
            echo "No edge secret configured (fork build) — the app will use the unprotected base URL."
          fi

      - name: Build APK
        env:
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # OWNTV_EDGE_KEY is exported into $GITHUB_ENV by the step above; app/build.gradle.kts reads
          # it as the env var it always did.
        run: |
          chmod +x ./gradlew
          if [ -n "$KEYSTORE_FILE" ]; then
            echo "Building the signed release APK (arm)"
            # Only the standard (arm: arm64-v8a + armeabi-v7a) flavor is shipped. The x86_64 flavor
            # (emulators) still exists in app/build.gradle.kts but is not built here.
            ./gradlew assembleStandardRelease --stacktrace
            ARM_SRC=$(ls app/build/outputs/apk/standard/release/*.apk | head -n1)
            echo "Built arm: $ARM_SRC"
            echo "ARM_SRC=$ARM_SRC" >> "$GITHUB_ENV"
          else
            echo "Building debug APK"
            ./gradlew assembleStandardDebug
            SRC=$(ls app/build/outputs/apk/standard/debug/*.apk | head -n1)
            echo "Built: $SRC"
            echo "ARM_SRC=$SRC" >> "$GITHUB_ENV"
          fi

      - name: Name the APK (DPTV-Player-v<version>)
        run: |
          mkdir -p dist
          if [ "$IS_TAG" = "true" ]; then
            OUT="DPTV-Player-v${{ steps.ver.outputs.name }}.apk"
          else
            OUT="DPTV-Player-dev-${GITHUB_SHA::7}.apk"
          fi
          cp "$ARM_SRC" "dist/$OUT"
          echo "APK_OUT=$OUT" >> "$GITHUB_ENV"
          echo "Packaged dist/$OUT (arm: arm64-v8a + armeabi-v7a)"
          # Every release file carries its version; there is no unversioned copy. The in-app
          # updater picks any .apk asset, so it needs no fixed file name.

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_OUT }}
          path: dist/*
          if-no-files-found: error

      - name: Extract release notes from CHANGELOG.md
        if: env.IS_TAG == 'true'
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          # The release body is what the in-app updater shows as "What's new", so it must be the
          # SHORT, bullet-only notes from CHANGELOG.md (the only changelog; detail lives in commits).
          #
          # This runs here rather than only in release-notes.yml because a release published by
          # GITHUB_TOKEN does not trigger other workflows, so that job never fires for tag builds.
          # It stays as a fallback for releases published by hand from the GitHub UI.
          #
          # Take "## <tag>" up to the next "## v" header; the header may carry a date/"unreleased"
          # tail ("## v4.1.5 — 2026-07-26") or nothing at all, so match the version as a whole word.
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$TAG" '
              $0 ~ ("^## " ver "([ \t]|$)") { flag=1; next }
              /^## v/ && flag { exit }  # first match only: older history may reuse a version
              flag { print }
            ' CHANGELOG.md > dist/RELEASE_NOTES.md || true
            # Trim leading/trailing blank lines.
            sed -i -e '/./,$!d' dist/RELEASE_NOTES.md
            awk 'NF{p=NR} {a[NR]=$0} END{for(i=1;i<=p;i++) print a[i]}' \
              dist/RELEASE_NOTES.md > dist/RELEASE_NOTES.trimmed.md
            mv dist/RELEASE_NOTES.trimmed.md dist/RELEASE_NOTES.md
          fi
          if [ ! -s dist/RELEASE_NOTES.md ]; then
            # No CHANGELOG.md section: list the commit titles since the previous release.
            PREV=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -vx "$TAG" | head -n1)
            echo "No CHANGELOG.md section for $TAG — listing commits since ${PREV:-the start}."
            git log --no-merges --pretty='- %s' ${PREV:+"$PREV"..}HEAD > dist/RELEASE_NOTES.md
          fi
          if [ ! -s dist/RELEASE_NOTES.md ]; then
            echo "See the commits for $TAG for details." > dist/RELEASE_NOTES.md
          fi
          echo "--- Release notes ---"
          cat dist/RELEASE_NOTES.md

      - name: Publish GitHub Release
        if: env.IS_TAG == 'true'
        uses: softprops/action-gh-release@v3
        with:
          # For the release button the tag does not exist yet: the release creates it on this commit.
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: DPTV-Player ${{ env.RELEASE_TAG }}
          files: |
            dist/${{ env.APK_OUT }}
          body_path: dist/RELEASE_NOTES.md
          # Must stay false: it appends GitHub's auto commit/PR list under the body, which buries the
          # short in-app notes the updater dialog shows.
          generate_release_notes: false

      # This repository is private, and GitHub answers its release API and APK downloads with 404 to
      # an app with no login, so the in-app updater reads a public repository that holds nothing but the
      # releases (CoreBuildInfo.releaseRepo in OwnTVApp.kt). RELEASES_REPO_TOKEN: a fine-grained token
      # with Contents read and write on dpacecca/DPTV-Player-releases only. Without it the copy is
      # skipped with a warning; the release above still stands.
      - name: Check the releases-repository token
        if: env.IS_TAG == 'true'
        env:
          RELEASES_REPO_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          if [ -n "$RELEASES_REPO_TOKEN" ]; then
            echo "HAS_RELEASES_TOKEN=true" >> "$GITHUB_ENV"
          else
            echo "::warning::RELEASES_REPO_TOKEN is not set: this release is not copied to dpacecca/DPTV-Player-releases, so the in-app updater will not see it."
          fi

      - name: Publish to the public releases repository
        if: env.IS_TAG == 'true' && env.HAS_RELEASES_TOKEN == 'true'
        uses: softprops/action-gh-release@v3
        with:
          repository: dpacecca/DPTV-Player-releases
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          # No target_commitish: the tag is created on that repository's default branch.
          tag_name: ${{ env.RELEASE_TAG }}
          name: DPTV-Player ${{ env.RELEASE_TAG }}
          files: |
            dist/${{ env.APK_OUT }}
          body_path: dist/RELEASE_NOTES.md
          generate_release_notes: false

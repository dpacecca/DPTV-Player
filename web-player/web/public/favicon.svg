<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- DPTV Web: DPTV-Player's green tile and play glyph (tools/brand/make_dptv_brand.py palette),
       with a browser-window badge where DPTV Recorder has its record dot. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16201B"/>
      <stop offset="100%" stop-color="#0A0F0C"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#4FEE94" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#4FEE94" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9CF7C2"/>
      <stop offset="100%" stop-color="#22C46C"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="256" height="256" rx="52" fill="url(#bg)"/>
  <rect x="4" y="4" width="248" height="248" rx="48" fill="none" stroke="#26352D" stroke-width="2"/>
  <circle cx="122" cy="122" r="120" fill="url(#glow)"/>

  <path d="M 87 74 L 169 128 L 87 182 Z" fill="url(#play)" stroke="#1C6B40" stroke-width="3" stroke-linejoin="round"/>

  <!-- browser badge -->
  <rect x="150" y="150" width="86" height="70" rx="12" fill="#0A0F0C"/>
  <rect x="156" y="156" width="74" height="58" rx="8" fill="#16201B" stroke="#4FEE94" stroke-width="4"/>
  <line x1="158" y1="172" x2="228" y2="172" stroke="#4FEE94" stroke-width="4"/>
  <circle cx="166" cy="164" r="2.6" fill="#4FEE94"/>
  <circle cx="175" cy="164" r="2.6" fill="#4FEE94"/>
  <circle cx="184" cy="164" r="2.6" fill="#4FEE94"/>
  <path d="M 186 181 L 204 192.5 L 186 204 Z" fill="#4FEE94"/>
</svg>
